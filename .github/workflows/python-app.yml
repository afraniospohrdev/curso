name: Python application

jobs:
   build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: pip install poetry

    - name: Generate lock file
      run: poetry lock

    - name: Install dependencies
      run: poetry install --no-root

    - name: Initialize database schema
      env:
        DATABASE_URL: "sqlite:///${{ github.workspace }}/test.db"
        PYTHONPATH: "."
      run: |
        poetry run python -c "from db import Base, engine; import models; Base.metadata.create_all(bind=engine)"

    - name: Run tests
      env:
        PYTEST_RUNNING: "1"
        DATABASE_URL: "sqlite:///${{ github.workspace }}/test.db"
        PYTHONPATH: "."
      run: |
        poetry run pytest -q -s
