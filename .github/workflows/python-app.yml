name: Python application

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: pip install poetry

    - name: Generate lock file
      run: poetry lock

    - name: Install dependencies
      run: poetry install --no-root

    - name: Run tests
      env:
        PYTEST_RUNNING: "1"
        DATABASE_URL: "sqlite:///./test.db"
        PYTHONPATH: "."
      run: |
        poetry run pytest -q -s

    - name: Build Docker image
      run: docker build -t fastapi-app:latest .

    - name: Run Docker container (smoke test)
      run: |
        docker run --rm -d -p 8000:8000 --name fastapi-test fastapi-app:latest
        sleep 5
        docker ps | grep fastapi-test
        docker stop fastapi-test
