name: Python application

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: pip install poetry

    - name: Install dependencies
      run: poetry install
      
    - name: Run tests
      run: poetry run pytest

    # Etapa de build Docker
    - name: Build Docker image
      run: docker build -t fastapi-app:latest .

    - name: Run Docker container (smoke test)
      run: |
        docker run --rm -d -p 8000:8000 --name fastapi-test fastapi-app:latest
        sleep 5
        # Verifica se o container está rodando
        docker ps | grep fastapi-test
        # Finaliza o container
        docker stop fastapi-test
